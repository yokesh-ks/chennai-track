name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-pr:
    name: validate-pr
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR links to task issue
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';
            const linked = (body.match(/#\d+/g) || []).map(n => n.replace('#', ''));
            const hasTask = linked.some(n => {
              const num = parseInt(n, 10);
              return Number.isFinite(num) && num > 0;
            });
            if (!hasTask) {
              core.setFailed('PR must link to a task issue (e.g. "Closes #5").');
            } else {
              core.info('PR links to issue(s): ' + linked.join(', '));
            }

  lint:
    name: lint
    runs-on: ubuntu-latest
    needs: validate-pr
    if: always() && (needs.validate-pr.result == 'success' || needs.validate-pr.result == 'skipped')
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: echo "lint placeholder"

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: lint
    if: always() && needs.lint.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: echo "unit-tests placeholder"

  instrumented-tests:
    name: instrumented-tests
    runs-on: ubuntu-latest
    needs: unit-tests
    if: always() && needs.unit-tests.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Instrumented tests
        run: echo "instrumented-tests placeholder"

  a11y-audit:
    name: a11y-audit
    runs-on: ubuntu-latest
    needs: instrumented-tests
    if: always() && needs.instrumented-tests.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - name: Accessibility audit
        run: echo "a11y-audit placeholder"

  build-release:
    name: build-release
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, instrumented-tests, a11y-audit]
    if: >-
      always() &&
      needs.lint.result == 'success' &&
      needs.unit-tests.result == 'success' &&
      needs.instrumented-tests.result == 'success' &&
      needs.a11y-audit.result == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release
        run: echo "build-release placeholder"
      - name: Create release tag
        if: github.ref == 'refs/heads/develop'
        id: tag
        run: |
          TAG="v$(date +%Y%m%d.%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Auto-merge to develop
        if: github.ref == 'refs/heads/develop' && steps.tag.outputs.tag != ''
        run: |
          echo "Auto-merge to develop after all checks passed"

  release:
    name: release
    runs-on: ubuntu-latest
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Release from signed tag
        run: echo "release placeholder"
