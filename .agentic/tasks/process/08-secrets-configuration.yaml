id: 08-secrets-configuration
epic: process
agent: devops-agent
title: "Secrets Configuration"
description: "Configure GitHub repository secrets for orchestrator and agent operations: ORCHESTRATOR_TOKEN, PLAY_SERVICE_ACCOUNT, KEYSTORE_*, and GitHub App private keys."
priority: High
effort: S
inputs:
  - "Repository: yokesh-ks/chennai-track"
  - "Secrets to configure:"
  - "  ORCHESTRATOR_TOKEN: GitHub PAT with repo, workflow, admin:org scope"
  - "  PLAY_SERVICE_ACCOUNT: Google Play service account JSON"
  - "  KEYSTORE_PASSWORD: Keystore password for Android signing"
  - "  KEYSTORE_ALIAS: Key alias for Android signing"
  - "  KEYSTORE_FILE: Base64-encoded keystore file"
  - "  APP_PRIVATE_KEYS: Private keys for 7 GitHub Apps (base64 encoded)"
  - "  APP_IDS: GitHub App IDs (comma-separated)"
  - "  APP_INSTALLATION_IDS: Installation IDs (comma-separated)"
outputs:
  - "All secrets added to GitHub repository secrets"
  - "Secrets are encrypted at rest"
  - "Secrets accessible to GitHub Actions workflows"
  - "No secrets in code or logs"
acceptance_criteria:
  - "ORCHESTRATOR_TOKEN secret exists and works for API calls"
  - "PLAY_SERVICE_ACCOUNT secret exists (base64 encoded JSON)"
  - "KEYSTORE_PASSWORD secret exists"
  - "KEYSTORE_ALIAS secret exists"
  - "KEYSTORE_FILE secret exists (base64 encoded)"
  - "7 APP_PRIVATE_KEY_<AGENT> secrets exist (base64 encoded)"
  - "APP_IDS secret exists with 7 comma-separated IDs"
  - "APP_INSTALLATION_IDS secret exists with 7 comma-separated IDs"
  - "Secrets not visible in workflow logs"
  - "Secrets can be referenced in workflows as ${{ secrets.SECRET_NAME }}"
validation_gates:
  - "Verify all secrets listed in repository settings"
  - "Test ORCHESTRATOR_TOKEN with API call"
  - "Verify base64 decoding works for PLAY_SERVICE_ACCOUNT"
  - "Verify base64 decoding works for KEYSTORE_FILE"
  - "Verify base64 decoding works for APP_PRIVATE_KEYS"
  - "Run workflow that references secrets - verify no leakage in logs"
depends_on:
  - 07-github-apps-creation
estimates:
  effort_hours: 3
  complexity: Low
  risk: High
linked_issue: 9
created_at: "2026-10-10"
updated_at: "2026-10-10"
