acceptance_criteria:
  - "GitHub repo exists with branch protection on main/develop (no direct push, required reviews, signed commits, linear history)"
  - "GitHub Apps created for each agent with scoped permissions (no admin access)"
  - "Secrets configured: ORCHESTRATOR_TOKEN, PLAY_SERVICE_ACCOUNT, KEYSTORE_*"
  - "CI workflow validates: PR→task link, lint, unit tests, instrumented tests, build-release, a11y audit"
  - "CODEOWNERS file enforces domain-specific reviews"
  - "Issue template for agent tasks with required fields"
  - "PR template enforces 'Closes #' and acceptance checklist"
  - "Orchestrator can create task issues + branches via API"
  - "Agent workers can claim, implement, push, create PRs via API"
  - "Release workflow triggers on signed tag push to Play Console internal track"
  - "Process metrics dashboard (cycle time, review time, CI pass rate, autonomy %)"
